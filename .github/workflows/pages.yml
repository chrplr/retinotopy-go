name: Deploy WebAssembly build to Pages

on:
  push:
    branches: [main]
    # Docs-only changes don't alter the bundle, so skip the (slow) rebuild.
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; cancel superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The experiment. Its committed go.mod requires the published goxpyriment,
      # which requires the published upstream go-sdl3, so `go build` and the
      # goreleaser release path work unchanged for everyone — no replace.
      - name: Checkout retinotopy-go
        uses: actions/checkout@v4
        with:
          path: retinotopy-go

      # The browser build needs SDL3-compiled-to-Emscripten plus js/wasm
      # bindings that upstream go-sdl3 does not have: building for GOOS=js
      # against upstream fails with "undefined: sdl.WaitAnimationFrame". The
      # fork supplies those bindings and the wasmsdl bundler (which ships
      # sdl.js + sdl.wasm).
      - name: Checkout go-sdl3-wasm fork
        uses: actions/checkout@v4
        with:
          repository: chrplr/go-sdl3-wasm
          ref: wasm-render-fixes
          path: go-sdl3-wasm

      - uses: actions/setup-go@v5
        with:
          go-version-file: retinotopy-go/go.mod
          cache-dependency-path: retinotopy-go/go.sum

      # Redirect go-sdl3 to the sibling fork for this build only. The replace is
      # never committed, so it cannot affect the native release builds, which
      # keep using upstream go-sdl3.
      - name: Point go-sdl3 at the fork (js/wasm bindings)
        working-directory: retinotopy-go
        run: go mod edit -replace github.com/Zyko0/go-sdl3=../go-sdl3-wasm

      # wasmsdl compiles the experiment to wasm (every asset is embedded via
      # //go:embed, so there is nothing to copy) and assembles index.html +
      # wasm_exec.js + main.wasm + sdl.js + sdl.wasm.
      #
      # The bundle is roughly 135 MB, nearly all of it main.wasm: the 100
      # pattern and 1680 mask PNGs are embedded in the binary. That is well
      # under the 1 GB Pages site limit, but it is a long first load for a
      # participant — web/index.html shows a download progress readout and
      # warns about the size before starting.
      - name: Build the WebAssembly bundle
        working-directory: go-sdl3-wasm
        run: |
          go run ./cmd/wasmsdl build \
            -out "$GITHUB_WORKSPACE/dist" \
            -html "$GITHUB_WORKSPACE/retinotopy-go/web/index.html" \
            "$GITHUB_WORKSPACE/retinotopy-go"

      - name: Report bundle size
        run: du -h dist/* | sort -h

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      # Pages deployment intermittently fails with "Deployment failed, try again
      # later." Retry up to three times with backoff before giving up.
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 20
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 30
      - id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
